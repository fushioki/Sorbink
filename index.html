<script>
const M=Math,pre=document.getElementById('d'),poster=document.getElementById('p'),W=60,H=28;
let A=0,B=0,last=0;
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){
pre.style.fontSize='10px';
pre.style.fontSize=10*poster.clientWidth*.9/pre.scrollWidth+'px'}
function draw(){
A+=.04;B+=.02;
const e=M.sin(A),g=M.cos(A),m=M.cos(B),n=M.sin(B);
const b=Array(W*H).fill(' '),z=Array(W*H).fill(0);
for(let j=0;j<6.28;j+=.07){
const d=M.cos(j),f=M.sin(j),q=d+2;
for(let i=0;i<6.28;i+=.02){
const c=M.sin(i),l=M.cos(i),D=1/(c*q*e+f*g+5),t=c*q*g-f*e;
const x=0|(W/2+W*.375*D*(l*q*m-t*n)),y=0|(H/2+H*.68*D*(l*q*n+t*m)),o=x+W*y;
const N=0|(8*((f*e-c*d*g)*m-c*d*e-f*g-l*d*n));
if(y>=0&&y<H&&x>=0&&x<W&&D>z[o]){z[o]=D;b[o]='-~:;=!*#$@@@'[N>0?N:0]}
}}
let s='';
for(let y=0;y<H;y++)s+=b.slice(y*W,y*W+W).join('')+'\n';
pre.textContent=s}
function loop(now){
requestAnimationFrame(loop);
if(now-last<40)return;
last=now;draw()}
draw();fit();
addEventListener('resize',fit);
if(!still)requestAnimationFrame(loop);
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2}):null;
document.querySelectorAll('.rv').forEach(el=>io?io.observe(el):el.classList.add('in'));
</script>
